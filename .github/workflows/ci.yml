name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src
      - name: Validate Flyway files
        run: |
          test -f flyway.toml
          for file in \
            sql/flyway/V001__create_work_tables.sql \
            sql/flyway/V002__create_work_order_summary.sql \
            sql/flyway/V003__create_analysis_technician_close_rank.sql \
            sql/flyway/V004__create_analysis_reopen_rate.sql \
            sql/flyway/V005__create_analysis_weekly_completed.sql \
            sql/flyway/V006__create_analysis_abnormal_sequences.sql; do
            test -f "$file"
          done
