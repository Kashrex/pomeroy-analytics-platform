name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover --start-directory tests --top-level-directory . --verbose

  flyway-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration naming and SQL files
        run: |
          test -n "$(find sql/flyway -name 'V*__*.sql')"
          find sql/flyway -name 'V*__*.sql' -print
